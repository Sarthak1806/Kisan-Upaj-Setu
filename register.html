<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration | Kisan Upaj Setu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f8f4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 850px;
            max-width: 100%;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: #176b35;
            color: white;
            padding: 30px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #d6ead9;
        }

        .form {
            padding: 35px;
        }

        .section-title {
            color: #176b35;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #405047;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #d7e1d8;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #16803c;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #16803c;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #126a31;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            color: #69756d;
            font-size: 13px;
        }

        .login-link a {
            color: #16803c;
            font-weight: bold;
            text-decoration: none;
        }

        @media(max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .form {
                padding: 22px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌾 Farmer Registration</h1>
        <p>Create your Kisan Upaj Setu account to book procurement slots.</p>
    </div>

    <form class="form" id="registerForm">

        <h2 class="section-title">Personal Information</h2>

        <div class="grid">

            <div class="field">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="field">
                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required>
            </div>

            <div class="field">
                <label for="farmerId">Farmer ID</label>

                <input
                    type="text"
                    id="farmerId"
                    placeholder="Enter Farmer ID"
                    required>
            </div>

            <div class="field">
                <label for="village">Village</label>

                <input
                    type="text"
                    id="village"
                    placeholder="Enter village name"
                    required>
            </div>

            <div class="field">
                <label for="district">District</label>

                <input
                    type="text"
                    id="district"
                    placeholder="Enter district"
                    required>
            </div>

            <div class="field">
                <label for="state">State</label>

                <input
                    type="text"
                    id="state"
                    placeholder="Enter state"
                    required>
            </div>

        </div>


        <h2 class="section-title" style="margin-top:35px;">
            Farming Information
        </h2>

        <div class="grid">

            <div class="field">
                <label for="crop">Main Crop</label>

                <select id="crop" required>
                    <option value="">Select crop</option>
                    <option>Wheat</option>
                    <option>Rice</option>
                    <option>Maize</option>
                    <option>Paddy</option>
                    <option>Mustard</option>
                    <option>Cotton</option>
                    <option>Soybean</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="field">
                <label for="quantity">Expected Quantity (Quintals)</label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    step="0.1"
                    placeholder="e.g. 50"
                    required>
            </div>

            <div class="field">
                <label for="password">Create Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 4 characters"
                    minlength="4"
                    required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    required>
            </div>

        </div>


        <button class="submit-btn" type="submit">
            Create Farmer Account →
        </button>

        <div class="login-link">
            Already registered?
            <a href="../index.html">Go to Login</a>
        </div>

    </form>

</div>


<script>

document.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const farmerId =
        document.getElementById("farmerId").value.trim();

    const village =
        document.getElementById("village").value.trim();

    const district =
        document.getElementById("district").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const crop =
        document.getElementById("crop").value;

    const quantity =
        document.getElementById("quantity").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    /* Mobile number validation */

    if (!/^\d{10}$/.test(mobile)) {

        alert("Please enter a valid 10-digit mobile number.");

        return;
    }


    /* Quantity validation */

    if (Number(quantity) < 1) {

        alert("Expected quantity must be at least 1 quintal.");

        return;
    }


    /* Password validation */

    if (password.length < 4) {

        alert("Password must contain at least 4 characters.");

        return;
    }


    /* Confirm password */

    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }


    /* Farmer data */

    const farmer = {

        name: name,
        mobile: mobile,
        farmerId: farmerId,
        village: village,
        district: district,
        state: state,
        crop: crop,
        quantity: quantity,
        password: password

    };


    /* Save farmer data */

    localStorage.setItem(
        "kisanSetuFarmer",
        JSON.stringify(farmer)
    );


    /* Success message */

    alert(
        "Registration successful! Your farmer account has been created."
    );


    /* Go to login */

    window.location.href = "../index.html";

});

</script>

</body>
</html>
