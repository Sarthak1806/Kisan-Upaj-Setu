<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration | Kisan Upaj Setu</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #e5f5e8, transparent 30%),
                #f4f8f4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 850px;
            max-width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.09);
            overflow: hidden;
            border: 1px solid #e4eee5;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg, #176b35, #218b45);
            color: white;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: "🌾";
            position: absolute;
            right: 30px;
            top: -12px;
            font-size: 90px;
            opacity: 0.12;
        }

        .header h1 {
            font-size: 28px;
            position: relative;
            z-index: 1;
        }

        .header p {
            margin-top: 8px;
            color: #d6ead9;
            position: relative;
            z-index: 1;
        }

        /* FORM */

        .form {
            padding: 35px;
        }

        .section-title {
            color: #176b35;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #405047;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #d7e1d8;
            border-radius: 9px;
            outline: none;
            background: white;
            transition: 0.25s;
        }

        input:hover,
        select:hover {
            border-color: #b7cdbb;
        }

        input:focus,
        select:focus {
            border-color: #16803c;
            box-shadow: 0 0 0 3px rgba(22,128,60,0.08);
        }

        /* BUTTON */

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16803c;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: #126a31;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(22,128,60,0.18);
        }

        /* LOGIN LINK */

        .login-link {
            text-align: center;
            margin-top: 18px;
            color: #69756d;
            font-size: 13px;
        }

        .login-link a {
            color: #16803c;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* SMALL FORM NOTE */

        .form-note {
            margin-top: 12px;
            text-align: center;
            color: #879289;
            font-size: 12px;
        }

        /* MOBILE */

        @media(max-width: 600px) {

            body {
                padding: 15px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .form {
                padding: 22px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header::after {
                right: 15px;
                font-size: 70px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🌾 Farmer Registration</h1>

        <p>
            Create your Kisan Upaj Setu account to book procurement slots.
        </p>

    </div>


    <!-- FORM -->

    <form class="form" id="registerForm">

        <h2 class="section-title">
            Personal Information
        </h2>


        <div class="grid">

            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="field">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required>

            </div>

            <div class="field">

                <label for="email">
                    Email (Optional)
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address">

                </div>


            <div class="field">

                <label for="village">
                    Village
                </label>

                <input
                    type="text"
                    id="village"
                    placeholder="Enter village name"
                    required>

            </div>


            <div class="field">

                <label for="district">
                    District
                </label>

                <input
                    type="text"
                    id="district"
                    placeholder="Enter district"
                    required>

            </div>


            <div class="field">

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="Enter state"
                    required>

            </div>

        </div>


        <!-- FARMING INFORMATION -->

        <h2
            class="section-title"
            style="margin-top:35px;"
        >
            Farming Information
        </h2>


        <div class="grid">

            <div class="field">

                <label for="crop">
                    Main Crop
                </label>

                <select id="crop" required>

                    <option value="">
                        Select crop
                    </option>

                    <option>Wheat</option>
                    <option>Rice</option>
                    <option>Maize</option>
                    <option>Paddy</option>
                    <option>Mustard</option>
                    <option>Cotton</option>
                    <option>Soybean</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="field">

                <label for="quantity">
                    Expected Quantity (Quintals)
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    step="0.1"
                    placeholder="e.g. 50"
                    required>

            </div>


            <div class="field">

                <label for="password">
                    Create Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 4 characters"
                    minlength="4"
                    required>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    required>

            </div>

        </div>


        <!-- SUBMIT -->

        <button
            class="submit-btn"
            type="submit"
        >
            Create Farmer Account →
        </button>


        <div class="form-note">
            Your registration details will be securely processed.
        </div>


        <div class="login-link">

            Already registered?

            <a href="index.html">
                Go to Login
            </a>

        </div>

    </form>

</div>


<script>

document.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const village =
        document.getElementById("village").value.trim();

    const district =
        document.getElementById("district").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const crop =
        document.getElementById("crop").value;

    const quantity =
        document.getElementById("quantity").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    /* Mobile validation */

    if (!/^\d{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }


    /* Quantity validation */

    if (Number(quantity) < 1) {
        alert("Expected quantity must be at least 1 quintal.");
        return;
    }


    /* Password validation */

    if (password.length < 4) {
        alert("Password must contain at least 4 characters.");
        return;
    }


    /* Confirm password */

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }


    /* ================= BACKEND REGISTRATION ================= */

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    phone: mobile,
                    email: email || null,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {
            alert(data.detail || "Registration failed.");
            return;
        }


        alert(
            "Registration Successful!\n\n" +
            "Your farmer account has been created.\n\n" +
            "You can now login using your mobile number and password."
        );


        window.location.href = "index.html";


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server.\n" +
            "Please make sure the backend is running."
        );

    }

});

</script>

</body>
</html>
